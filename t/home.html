<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Deploy Platform</title>
<style>
body{margin:0;padding:20px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fafafa;color:#18181b}
a{text-decoration:none}
.c{background:#fff;border:1px solid #e4e4e7;border-radius:1rem;padding:16px;margin:8px 0}
.b:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,0,0,.08)}
.b{display:inline-block;padding:6px 14px;border-radius:50px;font-size:12px;margin:3px;cursor:pointer}
.bk{background:#18181b;color:#fff;border:none}
.bg{border:1px solid #e4e4e7;background:0 0;color:#18181b}
.br{border:1px solid #fca5a5;color:#ef4444;background:0 0}
.sm{font-size:12px;color:#71717a}
</style>
<div style="max-width:900px;margin:0 auto">
<h1 style="font-size:2rem;font-weight:700;margin-bottom:8px">🚀 Deploy Platform</h1>
<p style="color:#71717a;font-size:14px;margin-bottom:20px">Deploy Python & Static apps ™ Built-in editor</p>
<button onclick="document.getElementById('mdl').style.display='flex'" style="background:#18181b;color:#fff;border:none;padding:10px 24px;border-radius:50px;cursor:pointer;font-size:14px;margin-bottom:24px">+ New App</button>
<div id="apps">
{{cards}}
</div>
</div>

<div id="mdl" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;justify-content:center;align-items:center">
<div style="background:#fff;border-radius:1rem;padding:20px;width:340px">
<h3 style="margin:0 0 12px 0">New App</h3>
<form onsubmit="cr(event)">
<input name="n" placeholder="App name" required style="width:100%;padding:10px 14px;border:1px solid #e4e4e7;border-radius:50px;margin:8px 0;font-size:14px;margin-bottom:12px">
<select name="tp" style="width:100%;padding:10px 14px;border:1px solid #e4e4e7;border-radius:50px;margin:8px 0;font-size:14px;margin-bottom:12px">
<option value="st">Static HTML &amp; CSS</option>
<option value="py">Python Flask</option>
</select>
<button class="b bk" style="width:100%;padding:10px">Create</button>
<button type="button" onclick="document.getElementById('mdl').style.display='none'" class="b bg" style="width:100%;padding:10px;margin-top:8px">Cancel</button>
</form>
</div>
</div>

<script>
async function cr(e){e.preventDefault();let f=new FormData(e.target);let d={name:f.get('n'),type:f.get('tp')};await fetch('/api/p',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});location.reload()}
async function tg(i){await fetch('/api/p/'+i+'/tg',{method:'POST'});location.reload()}
async function dl(i){if(confirm('Delete?')){await fetch('/api/p/'+i,{method:'DELETE'});location.reload()}}
</script>
