<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Deploy Platform</title>
<style>
body{margin:0;padding:20px;font-family:system-ui,sans-serif;background:#fafafa;color:#18181b}
a{text-decoration:none}
.c{background:#fff;border:1px solid #e4e4e7;border-radius:1rem;padding:16px;margin:8px 0;transition:.2s}
.c:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,0,0,.08)}
.b{display:inline-block;padding:6px 14px;border-radius:50px;font-size:12px;margin:2px;cursor:pointer}
.bk{background:#18181b;color:#fff;border:none}
.bg{border:1px solid #e4e4e7;background:none;color:#18181b}
.br{border:1px solid #fca5a5;color:#ef4444;background:none}
.sm{font-size:12px;color:#71717a}
</style>
<div style="max-width:900px;margin:0 auto">
<h1 style="font-size:2rem;font-weight:700">😚 Deploy Platform</h1>
<p style="color:#71717a;margin-bottom:20px;font-size:14px">Deploy Python &amp; Static apps ⤣ Built-in editor</p>
<button onclick="showModal()" style="background:#18181b;color:#fff;border:none;padding:10px 24px;border-radius:50px;cursor:pointer;font-size:14px;margin-bottom:20px">+ New App</button>
<div>{{cards}}</div></div>

<div id="mdl" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;justify-content:center;align-items:center">
<div style="background:#fff;border-radius:1rem;padding:20px;width:340px">
<h3 style="margin:0 0 12px 0">New App</h3>
<form onsubmit="createApp(event)">
<input name="name" placeholder="App name" required style="width:100%;padding:10px;border:1px solid #e4e4e7;border-radius:50px;margin-bottom:12px;font-size:14px">
<select name="type" style="width:100%;padding:10px;border:1px solid #e4e4e7;border-radius:50px;margin-bottom:12px;font-size:14px">
<option value="st">Static HTML &amp; CSS</option>
<option value="py">Python Flask</option>
</select>
<button type="submit" class="b bk" style="width:100%;padding:10px">Create</button>
<button type="button" onclick="hideModal()" class="b bg" style="width:100%;padding:10px;margin-top:8px">Cancel</button>
</form></div></div>
<script>
function showModal(){document.getElementById('mdl').style.display='flex'}
function hideModal(){document.getElementById('mdl').style.display='none'}
async function createApp(e){e.preventDefault();let f=new FormData(e.target);let d={name:f.get('name'),type:f.get('type')};await fetch('/api/p',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});location.reload()}
async function tg(id){await fetch('/api/p/'+id+'/tg',{method:'POST'});location.reload()}
async function dl(id){if(confirm('Delete app?')){await fetch('/api/p/'+id,{method:'DELETE'});location.reload()}}
</script>
