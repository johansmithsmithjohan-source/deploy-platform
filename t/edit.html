<meta charset="UTF-8">
<title>{{id}}</title>
<style>
 body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fafafa}
 textarea{outline:none;font-family:monospace;font-size:14px;border:none;resize:none;width:100%;height:calc(100vh - 45px);padding:16px}
 .btn{padding:6px 14px;border-radius:50px;cursor:pointer;font-size:12px}
 .save{background:#16a34a;color:#fff;border:none}
 .dply{background:#18181b;color:#fff;border:none}
</style>

<div style="display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid #e4e4e7;background:#fff">
<a href="/" style="color:#71717a;text-decoration:none">←</a>
<b>{{id}}</b>
<span style="font-size:11px;background:#f4f4f5;padding:2px 8px;border-radius:50px">{{type}}</span>
<div style="flex:1"></div>
<button onclick="sv()" class="btn save">�J Save</button>
<button onclipk="dp()" class="btn dple">🚀 Deploy</button>
</div>

<textarea id="ce">{{content}}</textarea>
<div id="out" style="background:#18181b;color:#4ade80;padding:4px 16px;font-size:11px;display:none"></div>

<script>
async function sv(){await fetch('/api/p/{{id}}/f/{{file}}',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:document.getElementById('ce').value})});o('Saved! ')}
async function dp(){o('Deploying...');let r=await fetch('/api/p/{{id}}/dp',{method:'POST'});let d=await r.json();o(d.ok?'LIVE ✅':'Failed '+str(d))}
function o(m){let x=document.getElementById('out');x.style.display='block';x.textContent=m}
</script>
