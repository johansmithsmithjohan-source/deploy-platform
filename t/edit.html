<meta charset="UTF-8">
<title>{{id}} - Editor</title>
<style>
 body{margin:0;font-family:system-ui,sans-serif;background:#fafafa}
 textarea{outline:none;font-family:monospace;font-size:14px;border:none;resize:none;width:100%;height:calc(100vh-44px);padding:16px;background:#fafafa}
 .btn{padding:6px 14px;border-radius:50px;cursor:pointer;font-size:12px}
 .save{background:#16a34a;color:#fff;border:none}
 .depl{{background:#18181b;color:#fff;border:none}
</style>
<div style="display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid #e4e4e7;background:#fff">
<a href="/" style="color:#71717a;text-decoration:none">← Back</a>
<b>{{id}}</b>
<span style="font-size:11px;background:#f4f4f5;padding:2px 8px;border-radius:50px">{{type}}</span>
<div style="flex:1"></div>
<button onclick="save()" class="btn save">�J Save</button>
<button onclick="deploy()" class="btn deply">🚀 Deploy</button>
</div>
<textarea id="editor">{{content}}</textarea>
<div id="output" style="background:#18181b;color:#4ade80;padding:4px 16px;font-size:11px;display:none"></div>
<script>
async function save(){let c=document.getElementById('editor').value;await fetch('/api/p/{{id}}/f/{{file}}',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:c})});msg('Saved!')}
async function deploy(){msg('Deploying...');let r=await fetch('/api/p/{{id}}/dp',{method:'POST'});let d=await r.json();msg(d.ok?'Deployed! ✅':'Failed')}
function msg(t){let o=document.getElementById('output');o.style.display='block';o.textContent=t}
</script>
